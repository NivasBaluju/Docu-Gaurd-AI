<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Docu-Gaurd AI — Enterprise AI Legal Intelligence</title>
  <meta name="description" content="Securely analyze, understand, compare, and manage legal documents using enterprise-grade AI. Trusted by law firms and multinational companies." />
  <meta name="theme-color" content="#FAF9F6" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root">
    <noscript>
      <div style="font-family: sans-serif; text-align: center; padding: 40px; color: #0F172A;">
        <h2>JavaScript is required</h2>
        <p>Please enable JavaScript to use Docu-Gaurd AI.</p>
      </div>
    </noscript>
  </div>
  <script>
    if (window.location.protocol === 'file:') {
      document.body.innerHTML = `
        <div style="font-family: system-ui, sans-serif; max-width: 580px; margin: 80px auto; padding: 32px; background: #FAF9F6; border: 1px solid #E2DDD6; border-radius: 16px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.06);">
          <div style="font-size: 40px; margin-bottom: 12px;">⚖️</div>
          <h2 style="color: #0F172A; margin: 0 0 8px 0; font-size: 24px;">Docu-Gaurd AI (React)</h2>
          <p style="color: #64748B; font-size: 15px; line-height: 1.5; margin-bottom: 24px;">
            React applications cannot be opened directly from the filesystem (<code>file:///</code>) due to browser ES-module security policies.
          </p>
          <div style="background: #FFFFFF; border: 1px solid #E2DDD6; border-radius: 10px; padding: 16px; text-align: left; font-size: 14px; color: #0F172A; margin-bottom: 24px;">
            <strong>To view the application:</strong>
            <ol style="margin: 8px 0 0 18px; padding: 0; line-height: 1.8;">
              <li>Open your browser to: <a href="http://localhost:3000" style="color: #1E3A8A; font-weight: 600;">http://localhost:3000</a> (Dev)</li>
              <li>Or visit: <a href="http://localhost:5000" style="color: #1E3A8A; font-weight: 600;">http://localhost:5000</a> (Production)</li>
            </ol>
          </div>
        </div>
      `;
    }
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
