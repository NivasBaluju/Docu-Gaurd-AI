services:
  - type: web
    name: docu-gaurd-ai-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:create_app() --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: INTERNAL_SERVICE_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://docu-gaurd-ai.vercel.app,http://localhost:5000,http://localhost:3000
