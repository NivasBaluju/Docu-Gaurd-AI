<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocuGuard AI — Hero Banner Asset Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #08080C;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .header p {
      font-size: 14px;
      color: #A1A1AA;
    }
    .banner-card {
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.8);
      max-width: 1200px;
      width: 100%;
      overflow: hidden;
    }
    .banner-card img {
      width: 100%;
      height: auto;
      display: block;
    }
    .footer-actions {
      display: flex;
      gap: 16px;
      margin-top: 20px;
    }
    .btn {
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      border-radius: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-download {
      background: #FFFFFF;
      color: #000000;
      border: 1px solid #FFFFFF;
    }
    .btn-back {
      background: transparent;
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .btn-back:hover {
      border-color: #FFFFFF;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>DocuGuard AI — Dark-Mode Hero Banner Layout</h1>
    <p>1200 × 630 Full-Resolution Vector SVG / Open Graph / Website Hero Asset</p>
  </div>

  <div class="banner-card">
    <img src="/assets/hero-banner.svg" alt="DocuGuard AI Hero Banner" />
  </div>

  <div class="footer-actions">
    <a href="/assets/hero-banner.svg" download="docuguard-hero-banner.svg" class="btn btn-download">
      Download SVG Banner Asset
    </a>
    <a href="/#/" class="btn btn-back">
      Return to Landing Page
    </a>
  </div>
</body>
</html>
