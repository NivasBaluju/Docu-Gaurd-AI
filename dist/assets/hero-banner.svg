<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Radial Background Glow -->
    <radialGradient id="heroGlow" cx="80%" cy="50%" r="60%" fx="85%" fy="45%">
      <stop offset="0%" stop-color="#181820" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#09090D" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#000000" stop-opacity="1" />
    </radialGradient>

    <!-- Linear Accent Fade -->
    <linearGradient id="goldBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="textFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D4D4D8" />
    </linearGradient>

    <!-- Dot Grid Pattern -->
    <pattern id="gridDots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.08" />
    </pattern>

    <!-- Hairline Rule Pattern -->
    <pattern id="gridLines" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M 120 0 L 0 0 0 120" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .serif-title { font-family: 'Fraunces', Georgia, serif; font-size: 54px; font-weight: 500; letter-spacing: -0.02em; fill: url(#textFade); }
    .mono-meta { font-family: 'SF Mono', Consolas, 'Courier New', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; fill: #A1A1AA; }
    .body-desc { font-family: -apple-system, BlinkMacSystemFont, 'Public Sans', sans-serif; font-size: 18px; line-height: 1.6; fill: #A1A1AA; }
    .badge-label { font-family: -apple-system, BlinkMacSystemFont, 'Public Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; fill: #FFFFFF; }
    .stat-val { font-family: 'Fraunces', Georgia, serif; font-size: 28px; font-weight: 600; fill: #FFFFFF; }
    .stat-lbl { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; fill: #71717A; }
  </style>

  <!-- Deep Obsidian Background -->
  <rect width="1200" height="630" fill="#000000" />
  <rect width="1200" height="630" fill="url(#heroGlow)" />
  <rect width="1200" height="630" fill="url(#gridLines)" />
  <rect width="1200" height="630" fill="url(#gridDots)" />

  <!-- Outer Architectural Border Frame -->
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />
  <rect x="28" y="28" width="1144" height="574" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1" />

  <!-- Corner Brackets -->
  <path d="M 24 44 L 24 24 L 44 24" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2" />
  <path d="M 1176 44 L 1176 24 L 1156 24" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2" />
  <path d="M 24 586 L 24 606 L 44 606" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2" />
  <path d="M 1176 586 L 1176 606 L 1156 606" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2" />

  <!-- Right Visual Area: Lady Justice Scales & Geometric Emblem -->
  <g transform="translate(850, 315)">
    <!-- Concentric Technical Radar Rings -->
    <circle cx="0" cy="0" r="220" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" stroke-dasharray="4,6" />
    <circle cx="0" cy="0" r="170" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1" />
    <circle cx="0" cy="0" r="120" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />
    <circle cx="0" cy="0" r="70" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="2,4" />

    <!-- Lady Justice Scales Silhouette Iconography -->
    <g transform="scale(1.4) translate(-40, -40)" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Central Pillar & Base -->
      <line x1="40" y1="12" x2="40" y2="70" stroke-opacity="0.8" />
      <line x1="26" y1="70" x2="54" y2="70" stroke-opacity="0.6" stroke-width="2.5" />
      <circle cx="40" cy="12" r="3" fill="#FFFFFF" fill-opacity="0.9" />

      <!-- Balance Beam -->
      <line x1="15" y1="24" x2="65" y2="24" stroke-opacity="0.9" stroke-width="2" />

      <!-- Left Pan -->
      <line x1="15" y1="24" x2="8" y2="44" stroke-opacity="0.6" />
      <line x1="15" y1="24" x2="22" y2="44" stroke-opacity="0.6" />
      <path d="M 6 44 C 6 52 24 52 24 44 Z" fill="#FFFFFF" fill-opacity="0.15" stroke-opacity="0.8" />

      <!-- Right Pan (Equilibrium) -->
      <line x1="65" y1="24" x2="58" y2="44" stroke-opacity="0.6" />
      <line x1="65" y1="24" x2="72" y2="44" stroke-opacity="0.6" />
      <path d="M 56 44 C 56 52 74 52 74 44 Z" fill="#FFFFFF" fill-opacity="0.15" stroke-opacity="0.8" />
    </g>

    <!-- Technical Coordinates & Provenance -->
    <text x="-90" y="245" class="mono-meta">SEC: DELAWARE CHANCERY / UCC ART.2</text>
    <text x="30" y="-180" class="mono-meta">SHA-256 INTEGRITY</text>
  </g>

  <!-- Left Content Area: Typography & Call to Action -->
  <g transform="translate(80, 110)">
    <!-- Security Classification Pill -->
    <g>
      <rect x="0" y="0" width="260" height="30" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" />
      <circle cx="16" cy="15" r="4" fill="#34D399" />
      <text x="28" y="19" class="badge-label">ENTERPRISE LEGAL COPILOT</text>
    </g>

    <!-- Main Headline (Editorial Fraunces Styling) -->
    <text x="0" y="90" class="serif-title">Judgment, applied</text>
    <text x="0" y="150" class="serif-title">with precision.</text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="205" class="body-desc">DocuGuard AI evaluates the contracts that define enterprise</text>
    <text x="0" y="235" class="body-desc">liability — autonomous diligence, risk scoring, and zero-trust</text>
    <text x="0" y="265" class="body-desc">statutory governance under continuous cryptographic audit.</text>

    <!-- Hairline Separator -->
    <line x1="0" y1="310" x2="560" y2="310" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1" />

    <!-- Telemetry Badges Strip -->
    <g transform="translate(0, 335)">
      <g transform="translate(0, 0)">
        <text x="0" y="24" class="stat-val">40+</text>
        <text x="0" y="44" class="stat-lbl">Statutory Frameworks</text>
      </g>

      <g transform="translate(190, 0)">
        <text x="0" y="24" class="stat-val">100%</text>
        <text x="0" y="44" class="stat-lbl">Cryptographic Proof</text>
      </g>

      <g transform="translate(370, 0)">
        <text x="0" y="24" class="stat-val">0ms</text>
        <text x="0" y="44" class="stat-lbl">Data Bleed Guarantee</text>
      </g>
    </g>

    <!-- Primary Action Button Simulation -->
    <g transform="translate(0, 420)">
      <rect x="0" y="0" width="190" height="46" fill="#FFFFFF" />
      <text x="26" y="28" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#000000">DISPATCH BRIEFING</text>
      
      <rect x="210" y="0" width="190" height="46" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1" />
      <text x="242" y="28" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">EXPLORE AUDIT</text>
    </g>
  </g>

  <!-- Bottom Metadata Bar -->
  <g transform="translate(80, 580)">
    <text x="0" y="0" class="mono-meta">DOCUGUARD AI // CONFIDENTIAL &amp; PROPRIETARY // ALL RIGHTS RESERVED</text>
    <text x="890" y="0" class="mono-meta">SHA256: e3b0c44298fc1c149afbf4c8996fb924</text>
  </g>
</svg>
