<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deciva — Enterprise AI Legal Intelligence</title>
  <meta name="description" content="Securely analyze, understand, compare, and manage legal documents using enterprise-grade AI. Trusted by law firms and multinational companies." />
  <meta name="theme-color" content="#FAF9F6" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <!-- Canvas kept in DOM but hidden via CSS for backward compat -->
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

  <header class="topbar" id="topbar" role="banner">
    <div class="brand" onclick="Router.go('#/')" role="link" aria-label="Deciva — Home" tabindex="0"
         onkeydown="if(event.key==='Enter')Router.go('#/')">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <span class="brand-text">Deciva</span>
    </div>

    <nav class="topnav" id="topnav" role="navigation" aria-label="Main navigation"></nav>

    <div class="topbar-actions" id="topbar-actions"></div>
  </header>

  <main id="app" role="main"></main>

  <footer class="footer" id="main-footer" role="contentinfo">
    <div class="footer-inner">
      <div class="footer-brand">Deciva</div>
      <div class="footer-badges">
        <span class="badge badge-neutral">AES-256-GCM</span>
        <span class="badge badge-neutral">Zero-Trust</span>
        <span class="badge badge-neutral">SHA-256 Integrity</span>
        <span class="badge badge-neutral">Immutable Audit</span>
      </div>
      <div class="footer-text">© 2025 Deciva · Enterprise Legal Intelligence</div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/background.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
